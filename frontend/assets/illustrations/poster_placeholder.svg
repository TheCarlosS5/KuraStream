<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111824" />
      <stop offset="50%" stop-color="#0C1018" />
      <stop offset="100%" stop-color="#080A10" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#5ED8C6" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" />
  <rect width="400" height="600" fill="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <path d="M 0 150 L 400 150 M 0 300 L 400 300 M 0 450 L 400 450" stroke="#263447" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 8" />
  <path d="M 100 0 L 100 600 M 200 0 L 200 600 M 300 0 L 300 600" stroke="#263447" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 8" />

  <!-- Decorative Outer Frame -->
  <rect x="24" y="24" width="352" height="552" rx="16" fill="none" stroke="#263447" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Center Emblem -->
  <g transform="translate(200, 270)">
    <!-- Ambient Circle -->
    <circle r="56" fill="url(#accentGrad)" stroke="#34465E" stroke-width="1.5" />
    <circle r="44" fill="#172131" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Film / Reel / Play Geometry -->
    <path d="M -10 -16 L 16 0 L -10 16 Z" fill="#818CF8" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#5ED8C6" stroke-width="1.5" stroke-dasharray="5 3" />
  </g>

  <!-- Typography -->
  <text x="200" y="375" text-anchor="middle" fill="#F5F7FB" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="1.5">KURASTREAM</text>
  <text x="200" y="400" text-anchor="middle" fill="#7D899C" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="12" letter-spacing="0.5">MEDIA ARCHIVE</text>
</svg>
