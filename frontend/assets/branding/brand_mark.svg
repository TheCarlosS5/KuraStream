<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40">
  <defs>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F7FB" />
      <stop offset="60%" stop-color="#F5F7FB" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2A3C" />
      <stop offset="100%" stop-color="#111824" />
    </linearGradient>
  </defs>

  <!-- Kanji Emblem Badge -->
  <g transform="translate(4, 4)">
    <rect width="32" height="32" rx="8" fill="url(#badgeGrad)" stroke="#34465E" stroke-width="1" />
    <!-- Subtle glow accent on border -->
    <rect width="32" height="32" rx="8" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4" />
    <!-- Kanji 蔵 -->
    <text x="16" y="22" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-weight="700" font-size="16" fill="#818CF8" text-anchor="middle" dominant-baseline="central">蔵</text>
  </g>

  <!-- Text KuraStream -->
  <text x="44" y="25" font-family="'Outfit', system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.5px">
    <tspan fill="#F5F7FB">Kura</tspan><tspan fill="#818CF8">Stream</tspan>
  </text>
</svg>
