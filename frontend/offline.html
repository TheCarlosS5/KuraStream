<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión - KuraStream</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090D0E;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #00E08F;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sin Conexión</h1>
    <p>Parece que has perdido la conexión a internet. Vuelve a conectarte para seguir disfrutando del catálogo de KuraStream.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
