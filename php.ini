; KuraStream PHP Configuration
extension_dir = "ext"
extension=curl
extension=fileinfo
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3

upload_max_filesize = 4096M
post_max_size = 4096M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
