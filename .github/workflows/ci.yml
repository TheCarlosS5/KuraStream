name: Continuous Integration

on:
  push:
    branches: [ main, refactor/*, feature/*, "feat/*" ]
  pull_request:
    branches: [ main, "feat/*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: kurastream_test
          MYSQL_USER: kurastream
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, mbstring, fileinfo
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # The E2E specs and test_real_media_pipeline generate their media fixtures with ffmpeg, which the
      # ubuntu-latest image does not ship.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run JavaScript UI Tests
        run: |
          node tests/ui_catalogue_rendering.mjs
          node tests/ui_review_regressions.mjs
          node tests/test_generate_app_release.mjs
          node tests/test_frontend_build.mjs
          node tests/ui_admin_health.mjs

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Initialize Database Migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: kurastream_test
          DB_USER: kurastream
          DB_PASS: testpassword
        run: |
          export JWT_SECRET=$(openssl rand -hex 32)
          php -r 'require_once "php_backend/db.php"; Database::initializeSchema();'

      - name: Run Playwright E2E Tests
        id: e2e
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: kurastream_test
          DB_USER: kurastream
          DB_PASS: testpassword
        run: |
          export JWT_SECRET=$(openssl rand -hex 32)
          npm run test:e2e
          # The production build, served as in production (hashed bundles, built page and service worker)
          npm run test:e2e:dist

      - name: Run PHP Test Suite
        id: php_tests
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: kurastream_test
          DB_USER: kurastream
          DB_PASS: testpassword
        run: |
          export JWT_SECRET=$(openssl rand -hex 32)
          php tests/run_all_tests.php 2>&1 | tee /tmp/php_tests.log
          exit ${PIPESTATUS[0]}

      - name: Docker Build and Smoke Test
        id: docker_smoke
        continue-on-error: true
        run: |
          docker build -t kurastream:test .
          docker build -t kurastream-nginx:test -f docker/nginx.Dockerfile .
          # The PHP-FPM master runs as root only to drop each pool to the kurastream user; the worker and
          # everything that executes application code must not be root.
          USER_ID=$(docker run --rm --entrypoint id kurastream:test -u kurastream)
          if [ "$USER_ID" = "0" ]; then
            echo "::error::The application user is root (UID 0), must be non-root"
            exit 1
          fi
          docker run --rm --entrypoint grep kurastream:test -q '^user = kurastream' /usr/local/etc/php-fpm.d/10-api.conf
          echo "Verified non-root application user (UID $USER_ID)"

          RANDOM_SECRET=$(openssl rand -hex 32)
          docker run -d --name kurastream_smoke --network host \
            -e JWT_SECRET="$RANDOM_SECRET" \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_NAME=kurastream_test \
            -e DB_USER=kurastream \
            -e DB_PASS=testpassword \
            kurastream:test
          docker run -d --name kurastream_smoke_nginx --network host \
            -e KURA_PORT=3001 \
            -e KURA_API_UPSTREAM=127.0.0.1:9000 \
            -e KURA_STREAM_UPSTREAM=127.0.0.1:9001 \
            kurastream-nginx:test

          READY=0
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/health || true)
            if [ "$STATUS" = "200" ]; then
              READY=1
              echo "Container health check passed (HTTP 200) on attempt $i"
              break
            fi
            sleep 1
          done
          # The web app itself must come from nginx too
          INDEX=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/ || true)

          docker logs kurastream_smoke || true
          docker logs kurastream_smoke_nginx || true
          docker stop kurastream_smoke kurastream_smoke_nginx || true
          docker rm kurastream_smoke kurastream_smoke_nginx || true

          if [ "$READY" -ne 1 ] || [ "$INDEX" != "200" ]; then
            echo "::error::Docker smoke health check failed (health ready=$READY, index=$INDEX)"
            exit 1
          fi

      - name: Generate Visual UI Audit Screenshots
        id: visual_qa
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: kurastream_test
          DB_USER: kurastream
          DB_PASS: testpassword
        run: |
          export JWT_SECRET=$(openssl rand -hex 32)
          node scripts/capture_screenshots.mjs final

      - name: Upload UI Audit Screenshots Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kurastream-ui-screenshots
          path: .artifacts/ui-audit/final/
          retention-days: 14

      - name: Verify All Test Suites Passed
        run: |
          if [ "${{ steps.e2e.outcome }}" != "success" ] || [ "${{ steps.php_tests.outcome }}" != "success" ] || [ "${{ steps.docker_smoke.outcome }}" != "success" ] || [ "${{ steps.visual_qa.outcome }}" != "success" ]; then
            FAIL_MSG="E2E: ${{ steps.e2e.outcome }}, PHP: ${{ steps.php_tests.outcome }}, Docker: ${{ steps.docker_smoke.outcome }}, VisualQA: ${{ steps.visual_qa.outcome }}"
            if [ -f /tmp/php_tests.log ]; then
              FAIL_DETAILS=$(grep -A 15 "FAIL ✗" /tmp/php_tests.log | tr '\n' ' ' || true)
              if [ -n "$FAIL_DETAILS" ]; then
                FAIL_MSG="${FAIL_MSG} - ${FAIL_DETAILS}"
              fi
            fi
            echo "::error::${FAIL_MSG}"
            exit 1
          fi

  android:
    name: Android Native CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: |
          cd android
          ./gradlew lintDebug

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # The release build runs R8 (shrinking and renaming), which is where serialization, Retrofit, Hilt or WorkManager
      # reflection can break without any debug build noticing. A throwaway key is enough to build it on every PR; the
      # real, published APK is signed by the android-release job below.
      - name: Assemble and lint the release build (throwaway key)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-release.jks" -alias ci -keyalg RSA -keysize 2048 -validity 2 \
            -storepass ci-pass-123 -keypass ci-pass-123 -dname "CN=KuraStream CI" >/dev/null 2>&1
          cd android
          KURA_KEYSTORE_FILE="$RUNNER_TEMP/ci-release.jks" KURA_KEYSTORE_PASSWORD=ci-pass-123 \
            KURA_KEY_ALIAS=ci KURA_KEY_PASSWORD=ci-pass-123 ./gradlew assembleRelease lintRelease

  android-release:
    name: Android Release APK (signed)
    runs-on: ubuntu-latest
    needs: android
    # Only after merging to main, and inert until the signing secrets exist (KURA_KEYSTORE_BASE64,
    # KURA_KEYSTORE_PASSWORD, KURA_KEY_ALIAS, KURA_KEY_PASSWORD): without them every step below is skipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KURA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KURA_KEYSTORE_BASE64 is not configured; skipping the signed release APK."
          fi

      - name: Set up JDK 21
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.signing.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KURA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KURA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KURA_KEYSTORE_PASSWORD: ${{ secrets.KURA_KEYSTORE_PASSWORD }}
          KURA_KEY_ALIAS: ${{ secrets.KURA_KEY_ALIAS }}
          KURA_KEY_PASSWORD: ${{ secrets.KURA_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Generate release metadata
        if: steps.signing.outputs.enabled == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KuraStream.apk
          node scripts/generate_app_release.mjs KuraStream.apk --variant release --notes "Build ${GITHUB_SHA::7}" --out app-release.json

      - name: Upload release APK and metadata
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kurastream-android-release
          path: |
            KuraStream.apk
            app-release.json
          retention-days: 30
