name: Continuous Integration

on:
  push:
    branches: [ main, refactor/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: kurastream
          MYSQL_USER: kurastream
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, mbstring, fileinfo
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run JavaScript UI Tests
        run: |
          node tests/ui_catalogue_rendering.mjs
          node tests/ui_review_regressions.mjs

      - name: Run PHP Test Suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: kurastream
          DB_USER: kurastream
          DB_PASS: testpassword
          JWT_SECRET: ci_test_secret_key_1234567890
        run: php tests/run_all_tests.php
