name: Security & Secret Scanning
on:
  push:
    branches: [ main, refactor/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
