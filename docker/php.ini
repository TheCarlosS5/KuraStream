; KuraStream PHP settings for the container (CLI worker and FPM pools). Pool-specific limits live in the pools.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 10
